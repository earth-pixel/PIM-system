<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bar {
      fill: #000000;
      shape-rendering: geometricPrecision;
    }
    @media (prefers-color-scheme: dark) {
      .bar {
        fill: #ffffff;
      }
    }
  </style>
  <!-- Bar 1 (Top) -->
  <polygon class="bar" points="6,10 26,4 26,8 6,14" />
  <!-- Bar 2 (Middle) -->
  <polygon class="bar" points="6,17 26,11 26,15 6,21" />
  <!-- Bar 3 (Bottom) -->
  <polygon class="bar" points="6,24 26,18 26,22 6,28" />
</svg>