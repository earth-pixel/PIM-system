<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>กำลังเปิดเอกสาร...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #525659;
      overflow: hidden;
      font-family: 'Sarabun', 'Helvetica Neue', Arial, sans-serif;
    }

    #viewer-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background: #323639;
      display: none; /* แสดงเมื่อโหลดสำเร็จ */
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-sizing: border-box;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .doc-info {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }

    .pdf-icon {
      color: #ff4d4f;
      display: flex;
      align-items: center;
    }

    #doc-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #f3f4f6;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 16px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      outline: none;
    }

    .btn-print {
      background: rgba(255, 255, 255, 0.1);
      color: #e5e7eb;
    }

    .btn-print:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-download {
      background: #0071e3;
      color: #fff;
    }

    .btn-download:hover {
      background: #0077ed;
      box-shadow: 0 0 12px rgba(0, 113, 227, 0.4);
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.1);
      color: #e5e7eb;
    }

    .btn-close:hover {
      background: #ff4d4f;
      color: #fff;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #fff;
      z-index: 10;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top: 4px solid #0071e3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading .msg {
      font-size: 14px;
      font-weight: 600;
      color: #e5e7eb;
    }

    #pdf-frame {
      position: fixed;
      top: 56px;
      left: 0;
      width: 100%;
      height: calc(100% - 56px);
      border: none;
      display: none;
    }

    #error-box {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fff;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #error-box .title {
      font-size: 16px;
      font-weight: 700;
    }

    #error-box .desc {
      font-size: 13px;
      color: #cbd5e1;
      max-width: 360px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      #viewer-header {
        padding: 0 12px;
        height: 50px;
      }
      #pdf-frame {
        top: 50px;
        height: calc(100% - 50px);
      }
      #doc-title {
        max-width: 120px;
        font-size: 13px;
      }
      .btn-action {
        padding: 0 10px;
        height: 32px;
        gap: 0;
      }
      .btn-action span {
        display: none;
      }
      .pdf-icon {
        display: none;
      }
      .action-group {
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Custom Header Toolbar -->
  <div id="viewer-header">
    <div style="display: flex; align-items: center; gap: 16px;">
      <button id="btn-close" class="btn-action btn-close" title="">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        
      </button>
      <div class="doc-info">
        <span class="pdf-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </span>
        <span id="doc-title">document.pdf</span>
      </div>
    </div>
    <div class="action-group">
      <button id="btn-print" class="btn-action btn-print">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>
        <span>พิมพ์เอกสาร</span>
      </button>
      <button id="btn-download" class="btn-action btn-download">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>ดาวน์โหลด PDF</span>
      </button>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="msg">กำลังเตรียมเอกสาร กรุณารอสักครู่...</div>
  </div>

  <iframe id="pdf-frame" title="เอกสาร PDF"></iframe>

  <div id="error-box">
    <div class="title">ไม่สามารถโหลดเอกสารได้</div>
    <div class="desc">
      กรุณากลับไปที่แท็บเดิมแล้วลองกดปุ่ม "เปิด PDF" อีกครั้ง
      หากยังไม่สำเร็จ ให้ตรวจสอบว่าเบราว์เซอร์ไม่ได้บล็อกป็อปอัพ
    </div>
  </div>

  <script>
    (function () {
      var loadingEl = document.getElementById('loading');
      var frameEl = document.getElementById('pdf-frame');
      var errorEl = document.getElementById('error-box');
      var headerEl = document.getElementById('viewer-header');
      var titleEl = document.getElementById('doc-title');
      var timeoutId = null;
      var currentBlobUrl = null;
      var currentTitle = 'document';

      function showPdf(url, title) {
        clearTimeout(timeoutId);
        currentBlobUrl = url;
        if (title) {
          currentTitle = title;
          document.title = title;
          titleEl.textContent = title + '.pdf';
        }
        
        // โหลด PDF พร้อมซ่อนแถบเครื่องมือเดิมของเบราว์เซอร์
        frameEl.src = url + '#toolbar=0';
        
        frameEl.style.display = 'block';
        headerEl.style.display = 'flex';
        loadingEl.style.display = 'none';
        errorEl.style.display = 'none';
      }

      function showError() {
        loadingEl.style.display = 'none';
        frameEl.style.display = 'none';
        headerEl.style.display = 'none';
        errorEl.style.display = 'flex';
      }

      // ปุ่มย้อนกลับ (ปิดหน้าต่าง)
      document.getElementById('btn-close').addEventListener('click', function () {
        window.close();
      });

      // ดาวน์โหลดไฟล์ PDF โดยใช้ tag <a> เพื่อระบุชื่อไฟล์แบบกำหนดเอง
      document.getElementById('btn-download').addEventListener('click', function () {
        if (!currentBlobUrl) return;
        var a = document.createElement('a');
        a.href = currentBlobUrl;
        a.download = currentTitle.endsWith('.pdf') ? currentTitle : currentTitle + '.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });

      // สั่งพิมพ์เอกสารจากตัว iframe
      document.getElementById('btn-print').addEventListener('click', function () {
        if (!frameEl) return;
        try {
          frameEl.contentWindow.focus();
          frameEl.contentWindow.print();
        } catch (e) {
          window.print();
        }
      });

      // รับข้อความจากแท็บต้นทางที่ส่ง PDF blob URL มาให้
      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;

        var data = event.data;
        if (data && data.type === 'load-pdf' && data.url) {
          showPdf(data.url, data.title);
        }
      });

      // แจ้งแท็บต้นทางว่าหน้าต่างนี้พร้อมรับ PDF แล้ว
      function notifyReady() {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'viewer-ready' }, window.location.origin);
        }
      }

      notifyReady();
      setTimeout(notifyReady, 300);

      // ถ้าไม่มี PDF ส่งมาภายใน 15 วินาที ให้ถือว่าล้มเหลว
      timeoutId = setTimeout(showError, 15000);
    })();
  </script>

</body>
</html>
